server {
    listen 80;

    # Docker's embedded DNS. Combined with using variables in proxy_pass below,
    # this makes nginx re-resolve upstream hostnames at request time instead of
    # caching the IP from startup — so container restarts/rebuilds (which change
    # container IPs) no longer strand nginx on a dead IP (502 Bad Gateway).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Frontend
    location / {
        set $upstream_frontend "frontend:3000";
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        set $upstream_backend "backend:8000";
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend docs (Swagger)
    location /docs {
        set $upstream_backend "backend:8000";
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $upstream_backend "backend:8000";
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
    }

    # phpMyAdmin (DB UI) — exposed via public URL at /phpmyadmin/
    # The rewrite strips the /phpmyadmin/ prefix (replacing the trailing-slash
    # proxy_pass behaviour, which can't be combined with a variable upstream).
    location /phpmyadmin/ {
        set $upstream_pma "phpmyadmin:80";
        rewrite ^/phpmyadmin/(.*)$ /$1 break;
        proxy_pass http://$upstream_pma;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        client_max_body_size 100M;
    }
}
